name: NDI for Android - CI/CD

on:
  push:
    branches: [main]
  pull_request:

# Superseded PR runs are pure waste. main is never cancelled — each run publishes a release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege by default; only publish-release escalates.
permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.301'
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  # Minimum line coverage, percent — a ratchet, not the target. Measured line coverage is
  # 63.3%, so 60 holds the current level without blocking work; the goal remains 70. Raise
  # this as coverage climbs, and never lower it to make a red run green.
  COVERAGE_MIN: '60'

jobs:
  # ════════════════════════════════════════════════════════════════════════════
  # Unit tests — the fast gate.
  #
  # Deliberately lean: tests/MauiApp.Tests references only src/Core, and both target plain
  # net10.0, so this needs no MAUI workload and no Android SDK. Restoring the test project
  # alone (never the solution, which would drag in the android head) keeps it under a minute.
  # ════════════════════════════════════════════════════════════════════════════
  # ── A note on job display names ──────────────────────────────────────────
  # The `name:` values below are load-bearing. Branch protection requires status checks by
  # display name, so renaming a job silently removes the check it was matching and the PR
  # sits at "Expected — waiting for status to be reported" forever, with every visible check
  # green. That happened on this branch: the names were changed to describe the new split,
  # which dropped `build-and-test`, `Build Release APK` and `Run Emulator UI Tests`.
  #
  # They are kept as they were. If you prefer clearer names, change these AND update the
  # required checks under Settings → Branches in the same go.
  unit-tests:
    name: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-tests-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-tests-

      - name: Restore test project
        run: dotnet restore tests/MauiApp.Tests/NdiForAndroid.Tests.csproj

      # Compile-only: tests/MauiApp.UITests references only src/Core (no MAUI, no Android SDK),
      # so this catches drift such as a page object referencing a removed TestIds constant
      # without waiting on the emulator job.
      - name: Build UI test project
        run: |
          dotnet restore tests/MauiApp.UITests/NdiForAndroid.UITests.csproj
          dotnet build tests/MauiApp.UITests/NdiForAndroid.UITests.csproj -c Release --no-restore

      - name: Run unit tests with coverage
        run: >
          dotnet test tests/MauiApp.Tests/NdiForAndroid.Tests.csproj
          -c Release --no-restore
          --collect:"XPlat Code Coverage"
          --logger "trx;LogFileName=test-results.trx"
          --results-directory test-results

      - name: Report results and coverage
        if: always()
        run: bash .github/scripts/report-test-results.sh test-results "${{ env.COVERAGE_MIN }}"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: |
            test-results/*.trx
            test-results/**/coverage.cobertura.xml
          retention-days: 7
          if-no-files-found: warn

  # ════════════════════════════════════════════════════════════════════════════
  # Version — computed once, consumed by the build and the release.
  #
  # version.properties supplies the major.minor line and the versionCode floor; the patch
  # auto-increments from the highest existing git tag, so no job has to write back to the
  # protected main branch. See .github/scripts/compute-version.sh.
  # ════════════════════════════════════════════════════════════════════════════
  version:
    name: Compute version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version_name: ${{ steps.v.outputs.version_name }}
      version_code: ${{ steps.v.outputs.version_code }}
      tag_name: ${{ steps.v.outputs.tag_name }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # tags are the source of truth for the patch number

      - id: v
        run: bash .github/scripts/compute-version.sh

  # ════════════════════════════════════════════════════════════════════════════
  # Android build — one publish, one AAB + one APK for the whole pipeline.
  #
  # Previously the android head was compiled here and published again in a second job.
  # It is now built once and passed downstream as artifacts. Ubuntu rather than Windows:
  # the MAUI workload installs in ~16s here versus ~5min on windows-latest, and there is no
  # Windows head to justify the runner.
  #
  # With `AndroidPackageFormats=aab;apk` the bundle is the primary output (jarsigner-signed)
  # and the APK is bundletool's universal APK extracted from that bundle, signed with the same
  # keystore. Same file name as before (`com.ndi.android-Signed.apk`), so e2e-reusable.yml and
  # publish-release are unaffected; the AAB is what goes to Google Play (#456).
  # ════════════════════════════════════════════════════════════════════════════
  build-android:
    name: Build Release APK   # display name preserved for branch protection — see note above
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # SHA-256 of the release/upload-key certificate — see KNOWLEDGE-BASE.md "Release signing".
      # Both signature checks below pin on it; a build signed with any other key is red.
      UPLOAD_KEY_SHA256: fcf1b453b782a0b9bbae3d48f8612b8ad3f78565af85864b18aa0b071cc84271

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-android-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-android-

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore dependencies
        run: dotnet restore NdiForAndroid.sln --ignore-failed-sources

      # Decodes the release keystore, when the secret is available, for the publish step below.
      # The two passwords are written to owner-only files: the bundle and the universal APK are
      # signed through bundletool, which accepts `pass:`/`file:` but not the `env:` prefix.
      - name: Decode release keystore
        id: keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::RELEASE_KEYSTORE_BASE64 is not available in this run; the APK and AAB will be debug-signed"
            exit 0
          fi
          printf '%s' "$KEYSTORE_B64" | tr -d '\n\r ' | base64 -d > "$RUNNER_TEMP/release.keystore"
          test -s "$RUNNER_TEMP/release.keystore"
          umask 077
          printf '%s' "$RELEASE_KEY_PASSWORD"      > "$RUNNER_TEMP/key.pass"
          printf '%s' "$RELEASE_KEYSTORE_PASSWORD" > "$RUNNER_TEMP/store.pass"
          echo "available=true" >> "$GITHUB_OUTPUT"

      # Stamps the computed version into the packages. Without this they ship the csproj
      # defaults (1 / 1.0.0) regardless of the release they are published under.
      - name: Publish Release APK + AAB
        shell: bash
        env:
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          # Signs the release packages with the stable release key when the keystore secret was
          # available above. Without these properties .NET Android signs with the runner's
          # ephemeral debug keystore, so every release carried a different certificate and
          # updates failed with INSTALL_FAILED_UPDATE_INCOMPATIBLE.
          SIGN_ARGS=()
          if [ "${{ steps.keystore.outputs.available }}" = "true" ]; then
            SIGN_ARGS+=(
              /p:AndroidKeyStore=true
              "/p:AndroidSigningKeyStore=$RUNNER_TEMP/release.keystore"
              "/p:AndroidSigningKeyAlias=$RELEASE_KEY_ALIAS"
              "/p:AndroidSigningKeyPass=file:$RUNNER_TEMP/key.pass"
              "/p:AndroidSigningStorePass=file:$RUNNER_TEMP/store.pass"
            )
          fi

          # AndroidPackageFormats (plural) is the supported property. Never pass the singular
          # AndroidPackageFormat next to it: the plural only takes effect while the singular is
          # empty, so `AndroidPackageFormat=apk` would silently drop the bundle again.
          dotnet publish src/MauiApp/NdiForAndroid.csproj \
            -f net10.0-android -c Release -o publish-output --no-restore \
            "/p:AndroidPackageFormats=aab;apk" \
            /p:AndroidUseToolchain=True \
            /p:ApplicationDisplayVersion=${{ needs.version.outputs.version_name }} \
            /p:ApplicationVersion=${{ needs.version.outputs.version_code }} \
            "${SIGN_ARGS[@]}"

      # The signed variants are the only usable ones — the unsigned APK fails with
      # INSTALL_PARSE_FAILED_NO_CERTIFICATES on device and in CI, and Play rejects an
      # unsigned bundle.
      - name: Locate signed APK and AAB
        shell: bash
        run: |
          APK_PATH=$(find publish-output -name "*-Signed.apk" | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "No signed APK produced under publish-output:"
            find publish-output -name "*.apk" || true
            exit 1
          fi
          AAB_PATH=$(find publish-output -name "*-Signed.aab" | head -1)
          if [ -z "$AAB_PATH" ]; then
            echo "No signed AAB produced under publish-output:"
            find publish-output -name "*.aab" || true
            exit 1
          fi
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"
          echo "AAB_PATH=$AAB_PATH" >> "$GITHUB_ENV"
          echo "Built $(basename "$APK_PATH") and $(basename "$AAB_PATH")"

      # Content checks that hold for every run, debug-signed or not: the bundle validates, the
      # stamped versionCode and targetSdk are what Play expects, the universal APK agrees, the
      # APK is 16-byte-aligned by bundletool, and every 64-bit native library in the bundle is
      # 16 KB page-aligned (a Play requirement for apps targeting API 35+).
      - name: Inspect bundle and APK
        shell: bash
        env:
          EXPECTED_VERSION_CODE: ${{ needs.version.outputs.version_code }}
        run: |
          # bundletool ships inside the .NET for Android workload pack — no download.
          DOTNET_PACKS="${DOTNET_ROOT:-$(dirname "$(readlink -f "$(command -v dotnet)")")}/packs"
          BUNDLETOOL=$(find "$DOTNET_PACKS" -path '*Microsoft.Android.Sdk*' -name bundletool.jar | sort -V | tail -1)
          if [ -z "$BUNDLETOOL" ]; then
            echo "::error::bundletool.jar not found under $DOTNET_PACKS (Microsoft.Android.Sdk pack)"
            find "$DOTNET_PACKS" -maxdepth 1 || true
            exit 1
          fi
          echo "bundletool: $BUNDLETOOL ($(java -jar "$BUNDLETOOL" version))"

          java -jar "$BUNDLETOOL" validate --bundle="$AAB_PATH"

          TSDK=$(java -jar "$BUNDLETOOL" dump manifest --bundle="$AAB_PATH" \
            --xpath=/manifest/uses-sdk/@android:targetSdkVersion)
          MSDK=$(java -jar "$BUNDLETOOL" dump manifest --bundle="$AAB_PATH" \
            --xpath=/manifest/uses-sdk/@android:minSdkVersion)
          VC=$(java -jar "$BUNDLETOOL" dump manifest --bundle="$AAB_PATH" \
            --xpath=/manifest/@android:versionCode)
          echo "AAB: minSdkVersion=$MSDK targetSdkVersion=$TSDK versionCode=$VC"
          if [ -z "$TSDK" ] || [ "$TSDK" -lt 36 ]; then
            echo "::error::AAB targetSdkVersion is '$TSDK'; Google Play requires 36 or higher"
            exit 1
          fi
          if [ "$VC" != "$EXPECTED_VERSION_CODE" ]; then
            echo "::error::AAB versionCode is '$VC', expected '$EXPECTED_VERSION_CODE' from the version job"
            exit 1
          fi

          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT2" dump badging "$APK_PATH" > "$RUNNER_TEMP/badging.txt"
          grep -o "targetSdkVersion:'[0-9]*'" "$RUNNER_TEMP/badging.txt"
          grep -o "versionCode='[0-9]*'" "$RUNNER_TEMP/badging.txt"
          grep -q "targetSdkVersion:'$TSDK'" "$RUNNER_TEMP/badging.txt" \
            || { echo "::error::APK targetSdkVersion differs from the bundle's ($TSDK)"; exit 1; }
          grep -q "versionCode='$EXPECTED_VERSION_CODE'" "$RUNNER_TEMP/badging.txt" \
            || { echo "::error::APK versionCode differs from the expected $EXPECTED_VERSION_CODE"; exit 1; }

          # The universal APK is aligned by bundletool, not by our build — assert it.
          ZIPALIGN=$(ls -d "$ANDROID_HOME"/build-tools/*/zipalign | sort -V | tail -1)
          "$ZIPALIGN" -c -P 16 4 "$APK_PATH" \
            || { echo "::error::APK is not 16 KB page-aligned at the zip layer (zipalign -c -P 16 4)"; exit 1; }

          # ELF LOAD segments of every 64-bit native library must be 16 KB (0x4000) aligned.
          # Only arm64-v8a and x86_64 are packaged (.NET 10 default RuntimeIdentifiers).
          rm -rf "$RUNNER_TEMP/aab-libs"
          unzip -q -o "$AAB_PATH" 'base/lib/arm64-v8a/*' 'base/lib/x86_64/*' -d "$RUNNER_TEMP/aab-libs"
          shopt -s nullglob
          n=0
          for so in "$RUNNER_TEMP"/aab-libs/base/lib/*/*.so; do
            n=$((n+1))
            readelf -lW "$so" | awk '$1=="LOAD" && $NF!="0x4000"{bad=1} END{exit bad}' \
              || { echo "::error::$so: LOAD segment not 16 KB aligned"; readelf -lW "$so" | grep LOAD; exit 1; }
          done
          if [ "$n" -eq 0 ]; then
            echo "::error::No native libraries found under base/lib/{arm64-v8a,x86_64} in the bundle"
            unzip -l "$AAB_PATH" | grep 'base/lib/' || true
            exit 1
          fi
          echo "16 KB alignment: $n native libraries checked"

          {
            echo "### Release packages"
            echo ""
            echo "- AAB: \`$(basename "$AAB_PATH")\` — minSdkVersion \`$MSDK\`, targetSdkVersion \`$TSDK\`, versionCode \`$VC\`"
            echo "- APK: \`$(basename "$APK_PATH")\` (universal, from the bundle) — targetSdkVersion \`$TSDK\`, zipalign -P 16 OK"
            echo "- 16 KB page alignment: \`$n\` native libraries (arm64-v8a + x86_64) checked"
          } >> "$GITHUB_STEP_SUMMARY"

      # Pins both signatures on the release/upload key. apksigner must report the v2 scheme —
      # a v1-only universal APK would not install on API 30+ — and the certificate digest; the
      # bundle is a JAR-signed zip, so jarsigner/keytool from the runner's JDK verify it.
      - name: Verify release signatures (APK + AAB)
        if: steps.keystore.outputs.available == 'true'
        shell: bash
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs "$APK_PATH" | tee "$RUNNER_TEMP/certs.txt"
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" "$RUNNER_TEMP/certs.txt" \
            || { echo "::error::The release APK carries no v2 signature"; exit 1; }
          grep -q "certificate SHA-256 digest: $UPLOAD_KEY_SHA256" "$RUNNER_TEMP/certs.txt" \
            || { echo "::error::The release APK is not signed with the registered upload key"; exit 1; }
          if grep -q "CN=Android Debug" "$RUNNER_TEMP/certs.txt"; then
            echo "::error::The release APK is debug-signed; the signing properties were not applied"
            exit 1
          fi

          jarsigner -verify -verbose:summary "$AAB_PATH" | tee "$RUNNER_TEMP/aab-verify.txt"
          grep -q "^jar verified" "$RUNNER_TEMP/aab-verify.txt" \
            || { echo "::error::jarsigner did not report 'jar verified.' for the AAB"; exit 1; }

          # keytool prints the digest as colon-separated upper-case hex.
          COLON=$(printf '%s' "$UPLOAD_KEY_SHA256" | sed 's/../&:/g; s/:$//' | tr a-f A-F)
          keytool -printcert -jarfile "$AAB_PATH" | tee -a "$RUNNER_TEMP/certs.txt"
          grep -q "SHA256: $COLON" "$RUNNER_TEMP/certs.txt" \
            || { echo "::error::The AAB is not signed with the registered upload key"; exit 1; }
          if grep -q "CN=Android Debug" "$RUNNER_TEMP/certs.txt"; then
            echo "::error::The release AAB is debug-signed; the signing properties were not applied"
            exit 1
          fi

      # `release-apk` is consumed by name in e2e-reusable.yml — keep it exactly as it is.
      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-apk
          path: ${{ env.APK_PATH }}
          retention-days: 7

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-aab
          path: ${{ env.AAB_PATH }}
          retention-days: 7

      - name: Remove keystore and password files
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/release.keystore" "$RUNNER_TEMP/key.pass" "$RUNNER_TEMP/store.pass" \
            "$RUNNER_TEMP/certs.txt" "$RUNNER_TEMP/aab-verify.txt" "$RUNNER_TEMP/badging.txt" \
            "$RUNNER_TEMP/aab-libs"

  # ════════════════════════════════════════════════════════════════════════════
  # E2E — runs on PRs into main and on main itself. Delegates to e2e-reusable.yml
  # so this job and emulator-tests.yml cannot drift again.
  #
  # This is a `uses:` call, so its required status checks are no longer a single
  # "Run Emulator UI Tests" — GitHub reports one check per job in the called
  # workflow: "Run Emulator UI Tests / Build Android APK" and
  # "Run Emulator UI Tests / Android Emulator UI Tests". Branch protection does
  # not reference the old single name (confirmed under Settings → Branches
  # before this change), so nothing else needs updating there.
  # ════════════════════════════════════════════════════════════════════════════
  e2e-tests:
    name: Run Emulator UI Tests
    needs: build-android
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
    uses: ./.github/workflows/e2e-reusable.yml
    with:
      avd_profile: 'Nexus 6'
      api_level: '35'
      font_scale: '1.0'
      require_device: true
      build_apk: false
      apk_artifact_name: 'release-apk'
    secrets: inherit

  # ════════════════════════════════════════════════════════════════════════════
  # Publish — tag and release, main only.
  #
  # Fails rather than silently overwriting when the tag already exists. The previous version
  # of this job re-published the same tag on every merge, so one stale release had its APK
  # replaced six times while the version never moved.
  # ════════════════════════════════════════════════════════════════════════════
  publish-release:
    name: Publish GitHub Release
    needs: [unit-tests, version, build-android, e2e-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify tag is unpublished
        env:
          TAG: ${{ needs.version.outputs.tag_name }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists. compute-version.sh should have advanced past it."
            echo "Refusing to overwrite an existing release."
            exit 1
          fi
          echo "$TAG is free."

      - name: Download APK artifact
        uses: actions/download-artifact@v8
        with:
          name: release-apk
          path: apk

      - name: Download AAB artifact
        uses: actions/download-artifact@v8
        with:
          name: release-aab
          path: aab

      - name: Locate APK and AAB
        run: |
          APK_PATH=$(find apk -name "*.apk" | head -1)
          if [ -z "$APK_PATH" ]; then echo "No APK in artifact"; exit 1; fi
          AAB_PATH=$(find aab -name "*.aab" | head -1)
          if [ -z "$AAB_PATH" ]; then echo "No AAB in artifact"; exit 1; fi
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"
          echo "AAB_PATH=$AAB_PATH" >> "$GITHUB_ENV"
          echo "Publishing $(basename "$APK_PATH") and $(basename "$AAB_PATH")"

      # The AAB on the release is the exact bundle uploaded to Google Play, so the Play
      # versionCode and the GitHub tag stay 1:1. fail_on_unmatched_files guards both paths.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag_name }}
          name: NDI for Android ${{ needs.version.outputs.version_name }}
          files: |
            ${{ env.APK_PATH }}
            ${{ env.AAB_PATH }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: true
          prerelease: false

      - name: Summarise
        run: |
          {
            echo "### Released ${{ needs.version.outputs.tag_name }}"
            echo ""
            echo "- Version name: \`${{ needs.version.outputs.version_name }}\`"
            echo "- Version code: \`${{ needs.version.outputs.version_code }}\`"
            echo "- APK: \`$(basename "$APK_PATH")\`"
            echo "- AAB: \`$(basename "$AAB_PATH")\`"
          } >> "$GITHUB_STEP_SUMMARY"
