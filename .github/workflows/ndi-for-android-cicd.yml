name: NDI for Android - CI/CD

on:
  push:
    branches: [main]
  pull_request:

# Superseded PR runs are pure waste. main is never cancelled — each run publishes a release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege by default; only publish-release escalates.
permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.301'
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  # Minimum line coverage, percent. Currently report-only: the real number has never been
  # measured, so gating blind would block every PR. Read it off a run, then raise this to 70.
  COVERAGE_MIN: '0'

jobs:
  # ════════════════════════════════════════════════════════════════════════════
  # Unit tests — the fast gate.
  #
  # Deliberately lean: tests/MauiApp.Tests references only src/Core, and both target plain
  # net10.0, so this needs no MAUI workload and no Android SDK. Restoring the test project
  # alone (never the solution, which would drag in the android head) keeps it under a minute.
  # ════════════════════════════════════════════════════════════════════════════
  unit-tests:
    name: Unit tests & coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-tests-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-tests-

      - name: Restore test project
        run: dotnet restore tests/MauiApp.Tests/NdiForAndroid.Tests.csproj

      - name: Run unit tests with coverage
        run: >
          dotnet test tests/MauiApp.Tests/NdiForAndroid.Tests.csproj
          -c Release --no-restore
          --collect:"XPlat Code Coverage"
          --logger "trx;LogFileName=test-results.trx"
          --results-directory test-results

      - name: Report results and coverage
        if: always()
        run: bash .github/scripts/report-test-results.sh test-results "${{ env.COVERAGE_MIN }}"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            test-results/*.trx
            test-results/**/coverage.cobertura.xml
          retention-days: 7
          if-no-files-found: warn

  # ════════════════════════════════════════════════════════════════════════════
  # Version — computed once, consumed by the build and the release.
  #
  # version.properties supplies the major.minor line and the versionCode floor; the patch
  # auto-increments from the highest existing git tag, so no job has to write back to the
  # protected main branch. See .github/scripts/compute-version.sh.
  # ════════════════════════════════════════════════════════════════════════════
  version:
    name: Compute version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version_name: ${{ steps.v.outputs.version_name }}
      version_code: ${{ steps.v.outputs.version_code }}
      tag_name: ${{ steps.v.outputs.tag_name }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tags are the source of truth for the patch number

      - id: v
        run: bash .github/scripts/compute-version.sh

  # ════════════════════════════════════════════════════════════════════════════
  # Android build — one APK for the whole pipeline.
  #
  # Previously the android head was compiled here and published again in a second job.
  # It is now built once and passed downstream as an artifact. Ubuntu rather than Windows:
  # the MAUI workload installs in ~16s here versus ~5min on windows-latest, and there is no
  # Windows head to justify the runner.
  # ════════════════════════════════════════════════════════════════════════════
  build-android:
    name: Build Android APK
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-android-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-android-

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore dependencies
        run: dotnet restore NdiForAndroid.sln --ignore-failed-sources

      # Stamps the computed version into the APK. Without this the package ships the csproj
      # defaults (1 / 1.0.0) regardless of the release it is published under.
      - name: Publish Release APK
        run: >
          dotnet publish src/MauiApp/NdiForAndroid.csproj
          -f net10.0-android -c Release -o publish-output --no-restore
          /p:AndroidPackageFormat=apk
          /p:AndroidUseToolchain=True
          /p:ApplicationDisplayVersion=${{ needs.version.outputs.version_name }}
          /p:ApplicationVersion=${{ needs.version.outputs.version_code }}

      # The signed variant is the only installable one — the unsigned APK fails with
      # INSTALL_PARSE_FAILED_NO_CERTIFICATES on device and in CI.
      - name: Locate signed APK
        run: |
          APK_PATH=$(find publish-output -name "*-Signed.apk" | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "No signed APK produced under publish-output:"
            find publish-output -name "*.apk" || true
            exit 1
          fi
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"
          echo "Built $(basename "$APK_PATH")"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: ${{ env.APK_PATH }}
          retention-days: 7

  # ════════════════════════════════════════════════════════════════════════════
  # E2E — runs on PRs into main and on main itself.
  #
  # The suite must be able to fail: E2E_REQUIRE_DEVICE makes AppiumDriverFixture throw on an
  # unavailable session instead of skipping, and the runner script asserts a non-zero passed
  # count. Before that, an all-skipped run exited 0 and the gate reported success.
  # ════════════════════════════════════════════════════════════════════════════
  e2e-tests:
    name: E2E emulator tests
    needs: build-android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main'

    env:
      APPIUM_SERVER_URL: http://127.0.0.1:4723/
      # Set to 'false' to make the suite report without blocking. Intended only as a temporary
      # escape hatch while a known driver-side defect is being fixed — leaving it off restores
      # the vacuous gate this pipeline exists to prevent, so put it back to 'true' after.
      E2E_REQUIRE_DEVICE: ${{ vars.E2E_REQUIRE_DEVICE || 'true' }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Required: the UITests project targets net10.0. Without this the job depends on
      # whichever SDK the runner image happens to ship.
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-uitests-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-uitests-

      - name: Restore UITests project
        run: dotnet restore tests/MauiApp.UITests/NdiForAndroid.UITests.csproj

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: apk

      - name: Locate downloaded APK
        run: |
          APK_PATH=$(find apk -name "*.apk" | head -1)
          if [ -z "$APK_PATH" ]; then echo "No APK in artifact"; exit 1; fi
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"
          echo "Using APK: $APK_PATH"

      - name: Setup Node.js for Appium
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Appium and UIAutomator2 driver
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache Android AVD and system image
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api35-x86_64-v1

      - name: Create AVD (only on cache miss)
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: Nexus 6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "AVD created and cached."

      - name: Run emulator tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: Nexus 6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          emulator-boot-timeout: 300
          script: bash ./testing/e2e/scripts/run-emulator-tests.sh "$APK_PATH"

      - name: Report e2e results
        if: always()
        run: bash .github/scripts/report-test-results.sh test-results

      # When the suite fails, the reason is almost always a session-creation error in the
      # Appium log. Print it inline so diagnosis does not require downloading an artifact.
      - name: Show Appium log on failure
        if: failure()
        run: |
          LOG=test-results/appium.log
          if [ ! -f "$LOG" ]; then
            echo "No $LOG produced — Appium never started."
            exit 0
          fi
          echo "===== appium.log (errors) ====="
          grep -iE "error|failed|refused|could not|unable|exception" "$LOG" | head -40 || echo "(no error lines matched)"
          echo "===== appium.log (last 60 lines) ====="
          tail -60 "$LOG"

      - name: Upload emulator test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-test-results
          path: test-results/*.trx
          retention-days: 7
          if-no-files-found: warn

      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-diagnostics
          path: |
            test-results/*.log
            test-results/*.txt
          retention-days: 7
          if-no-files-found: warn

      # Deliberately the last step: the artifact-upload steps emit hundreds of lines, so a
      # failure message printed before them is buried. Keeping it at the tail means the reason
      # for the failure is the last thing in the log.
      - name: Failure summary
        if: failure()
        run: |
          TRX=$(find test-results -name '*.trx' -type f -print -quit 2>/dev/null || true)
          echo "=================== E2E FAILURE SUMMARY ==================="
          if [ -z "$TRX" ]; then
            echo "No TRX produced — the suite did not run to completion."
            exit 0
          fi
          python3 - "$TRX" <<'PY'
          import sys, xml.etree.ElementTree as ET
          from collections import OrderedDict
          NS = '{http://microsoft.com/schemas/VisualStudio/TeamTest/2010}'
          try:
              root = ET.parse(sys.argv[1]).getroot()
          except Exception as e:
              print(f"Could not parse TRX: {e}"); sys.exit(0)
          groups = OrderedDict()
          for r in root.iter(f'{NS}UnitTestResult'):
              if r.get('outcome') != 'Failed':
                  continue
              msg = st = ''
              for m in r.iter(f'{NS}Message'):
                  if m.text: msg = m.text.strip(); break
              for s in r.iter(f'{NS}StackTrace'):
                  if s.text: st = s.text.strip(); break
              groups.setdefault((msg, st), []).append(r.get('testName') or '')
          for (msg, st), names in groups.items():
              print(f"\n--- {len(names)} test(s) failed with: ---")
              print(msg or "(no message)")
              if st:
                  print("\nStack trace (first 15 frames):")
                  print('\n'.join(st.splitlines()[:15]))
              print(f"\nAffected: {', '.join(n.split('.')[-1] for n in names[:12])}")
          PY
          echo "==========================================================="

  # ════════════════════════════════════════════════════════════════════════════
  # Publish — tag and release, main only.
  #
  # Fails rather than silently overwriting when the tag already exists. The previous version
  # of this job re-published the same tag on every merge, so one stale release had its APK
  # replaced six times while the version never moved.
  # ════════════════════════════════════════════════════════════════════════════
  publish-release:
    name: Publish GitHub Release
    needs: [unit-tests, version, build-android, e2e-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag is unpublished
        env:
          TAG: ${{ needs.version.outputs.tag_name }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists. compute-version.sh should have advanced past it."
            echo "Refusing to overwrite an existing release."
            exit 1
          fi
          echo "$TAG is free."

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: apk

      - name: Locate APK
        run: |
          APK_PATH=$(find apk -name "*.apk" | head -1)
          if [ -z "$APK_PATH" ]; then echo "No APK in artifact"; exit 1; fi
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"
          echo "Publishing $(basename "$APK_PATH")"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag_name }}
          name: NDI for Android ${{ needs.version.outputs.version_name }}
          files: ${{ env.APK_PATH }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: true
          prerelease: false

      - name: Summarise
        run: |
          {
            echo "### Released ${{ needs.version.outputs.tag_name }}"
            echo ""
            echo "- Version name: \`${{ needs.version.outputs.version_name }}\`"
            echo "- Version code: \`${{ needs.version.outputs.version_code }}\`"
            echo "- APK: \`$(basename "$APK_PATH")\`"
          } >> "$GITHUB_STEP_SUMMARY"
