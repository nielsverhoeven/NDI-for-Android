name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '0 4 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.301'
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  analyze:
    name: Analyze (csharp)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-codeql-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-codeql-

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual
          queries: security-and-quality

      # CodeQL only sees what the build compiles. This previously built src/Core alone, which
      # left the whole of src/MauiApp unanalyzed — including NdiBridge/Interop, the P/Invoke
      # layer where the manual marshalling and buffer handling live. Build both.
      - name: Build for CodeQL
        run: |
          dotnet restore NdiForAndroid.sln --ignore-failed-sources
          dotnet build src/Core/NdiForAndroid.Core.csproj -c Release --no-restore
          dotnet build src/MauiApp/NdiForAndroid.csproj -f net10.0-android -c Release --no-restore \
            /p:AndroidUseToolchain=True

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:csharp
          # Must be true: the severity gate below reads alerts, which do not exist until
          # GitHub has finished processing the uploaded SARIF.
          wait-for-processing: true

      # analyze@v4 has no built-in severity threshold — it uploads results and succeeds. The
      # gate is applied here by reading the alerts back for this ref.
      - name: Gate on high-severity findings
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.ref }}
        run: bash .github/scripts/codeql-severity-gate.sh "$REF"
