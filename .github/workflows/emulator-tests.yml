# Manual emulator runs, and the regression-proof harness.
#
# Beyond running the UI suite on demand, this workflow answers a question the PR pipeline cannot:
# *does a regression test actually fail against the bug it was written for?* A test written after
# a fix has never seen the defect, so nothing proves it would have caught it — and a regression
# test that cannot fail on the original bug proves nothing at all. #313 makes that the acceptance
# bar for the theme and inset tests.
#
# `app_ref` builds the APK from any commit while the tests still come from this branch, so the
# current suite can be pointed at a pre-fix build of the app. With `expect_failure`, the run is
# green when the test *fails*, which is what proves it works.
#
#   Prove the #294 rail-tint test catches the original defect:
#     app_ref:        <commit immediately before the #294 fix>
#     test_filter:    FullyQualifiedName~Theme_NavigationIcons_ContrastAgainstTheirBackground
#     expect_failure: true
name: Emulator UI Tests (manual only)

on:
  workflow_dispatch:
    inputs:
      app_ref:
        description: 'Git ref to build the APK from. Blank = this branch. Set to a pre-fix commit to prove a regression test.'
        required: false
        type: string
      test_filter:
        description: 'dotnet test --filter expression. Blank = run everything.'
        required: false
        type: string
      expect_failure:
        description: 'Invert the result: the run passes only if a test FAILS. Use with app_ref to prove a regression test.'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1: Build the APK on a plain runner (no emulator overhead).
  # Uploads the APK as an artifact so the emulator job can skip the build.
  # ─────────────────────────────────────────────────────────────────────────────
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # The app is built from app_ref when given, so it can be an older commit than the tests.
      # Blank falls through to the branch the workflow was dispatched on.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.app_ref || github.ref }}

      - name: Report what is being built
        run: |
          echo "Building the app from: $(git rev-parse HEAD)"
          git log -1 --format='  %h %s (%ci)'
          if [ -n "${{ inputs.app_ref }}" ]; then
            echo "NOTE: this is a non-default ref — tests will come from ${{ github.ref }}."
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore dependencies
        run: dotnet restore NdiForAndroid.sln

      - name: Build Release APK
        run: |
          dotnet publish src/MauiApp/NdiForAndroid.csproj -f net10.0-android -c Release -o publish-output
          APK_PATH=$(find publish-output -name "*.apk" | head -1)
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV
          echo "Found APK: $APK_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: ${{ env.APK_PATH }}
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2: Download the pre-built APK and run it on an Android emulator.
  # AVD + system image are cached so emulator boot is fast on subsequent runs.
  # ─────────────────────────────────────────────────────────────────────────────
  emulator-tests:
    name: Android Emulator UI Tests
    needs: build-apk
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      APPIUM_SERVER_URL: http://127.0.0.1:4723/
      # Tests must be able to fail for a proof run to mean anything, so the fixture still treats
      # a missing device as fatal here exactly as it does in the PR pipeline.
      E2E_REQUIRE_DEVICE: 'true'
      E2E_TEST_FILTER: ${{ inputs.test_filter }}
      E2E_EXPECT_FAILURE: ${{ inputs.expect_failure }}

    steps:
      # Deliberately NOT app_ref: the tests always come from the branch under development. That
      # separation is the whole mechanism — current tests, historical app.
      - uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup .NET (for dotnet test only)
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore UITests project
        run: dotnet restore tests/MauiApp.UITests/NdiForAndroid.UITests.csproj

      - name: Download APK artifact
        uses: actions/download-artifact@v8
        with:
          name: android-apk
          path: apk

      # Absolute — see the same step in ndi-for-android-cicd.yml. dotnet test runs the test
      # host from the project output directory, so a workspace-relative path does not resolve
      # inside AppiumDriverFixture.
      - name: Locate downloaded APK
        run: |
          APK_PATH=$(find "$PWD/apk" -name '*.apk' -type f -print -quit)
          if [ -z "$APK_PATH" ]; then echo "No APK in artifact"; exit 1; fi
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV
          echo "Using APK: $APK_PATH"

      - name: Setup Node.js for Appium
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Appium and UIAutomator2 driver
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache Android AVD and system image
        uses: actions/cache@v6
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api35-x86_64-v1

      - name: Create AVD (only on cache miss)
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: Nexus 6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "AVD created and cached."

      - name: Run emulator tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: Nexus 6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          emulator-boot-timeout: 300
          script: bash ./testing/e2e/scripts/run-emulator-tests.sh "$APK_PATH"

      - name: Upload emulator test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: emulator-test-results
          path: test-results/*.trx
          if-no-files-found: warn

      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: emulator-diagnostics
          path: |
            test-results/*.log
            test-results/*.txt
            test-results/failure-evidence/**
          if-no-files-found: warn
