# Manual emulator runs, and the regression-proof harness.
#
# Beyond running the UI suite on demand, this workflow answers a question the PR pipeline cannot:
# *does a regression test actually fail against the bug it was written for?* A test written after
# a fix has never seen the defect, so nothing proves it would have caught it — and a regression
# test that cannot fail on the original bug proves nothing at all. #313 makes that the acceptance
# bar for the theme and inset tests.
#
# `app_ref` builds the APK from any commit while the tests still come from this branch, so the
# current suite can be pointed at a pre-fix build of the app. With `expect_failure`, the run is
# green when the test *fails*, which is what proves it works.
#
#   Prove the #294 rail-tint test catches the original defect:
#     app_ref:        <commit immediately before the #294 fix>
#     test_filter:    FullyQualifiedName~Theme_NavigationIcons_ContrastAgainstTheirBackground
#     expect_failure: true
name: Emulator UI Tests (manual only)

on:
  workflow_dispatch:
    inputs:
      app_ref:
        description: 'Git ref to build the APK from. Blank = this branch. Set to a pre-fix commit to prove a regression test.'
        required: false
        type: string
      avd_profile:
        description: 'avdmanager device profile.'
        required: false
        type: string
        default: 'Nexus 6'
      api_level:
        description: 'Android API level.'
        required: false
        type: string
        default: '35'
      font_scale:
        description: 'Device font scale (e.g. 1.0, 1.3, 2.0).'
        required: false
        type: string
        default: '1.0'
      test_filter:
        description: 'dotnet test --filter expression. Blank = run everything.'
        required: false
        type: string
      expect_failure:
        description: 'Invert the result: the run passes only if a test FAILS. Use with app_ref to prove a regression test.'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  e2e:
    uses: ./.github/workflows/e2e-reusable.yml
    with:
      app_ref: ${{ inputs.app_ref }}
      avd_profile: ${{ inputs.avd_profile }}
      api_level: ${{ inputs.api_level }}
      font_scale: ${{ inputs.font_scale }}
      test_filter: ${{ inputs.test_filter }}
      expect_failure: ${{ inputs.expect_failure }}
      require_device: true
      release_sign: true
    secrets: inherit
